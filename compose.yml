name: voltgrid

services:
    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: voltgrid
            POSTGRES_USER: voltgrid_dev
            POSTGRES_PASSWORD: voltgrid
        ports:
            - "5433:5432"
        volumes:
            - voltgrid_postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U voltgrid_dev -d voltgrid"]
            interval: 3s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    load-balancer:
        build: ./load-balancer
        environment:
            LOAD_BALANCER_ADDR: :8787
        ports:
            - "8787:8787"
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health >/dev/null"]
            interval: 3s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    csms:
        build: ./csms
        depends_on:
            postgres:
                condition: service_healthy
            load-balancer:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql://voltgrid_dev:voltgrid@postgres:5432/voltgrid
            LOAD_BALANCER_URL: http://load-balancer:8787
            CHARGER_MAX_POWER_KW: "50"
            DASHBOARD_ORIGIN: http://localhost:9000
            PORT: "6773"
        ports:
            - "6773:6773"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "bun -e \"fetch('http://127.0.0.1:6773/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
                ]
            interval: 3s
            timeout: 3s
            retries: 30
        restart: unless-stopped

    dashboard:
        build: ./dashboard
        depends_on:
            csms:
                condition: service_healthy
        environment:
            NEXT_PUBLIC_CSMS_HTTP_URL: http://localhost:6773
            NEXT_PUBLIC_CSMS_WS_URL: ws://localhost:6773
        ports:
            - "9000:9000"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "bun -e \"fetch('http://127.0.0.1:9000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
                ]
            interval: 3s
            timeout: 3s
            retries: 30
        restart: unless-stopped

    info:
        image: alpine:3.22
        depends_on:
            dashboard:
                condition: service_healthy
            csms:
                condition: service_healthy
            load-balancer:
                condition: service_healthy
        command:
            - /bin/sh
            - -c
            - |
                printf '\n'
                printf '============================================================\n'
                printf '  VOLTGRID IS READY\n'
                printf '============================================================\n'
                printf '  Dashboard       http://localhost:9000\n'
                printf '  CSMS health     http://localhost:6773/healthz\n'
                printf '  OCPP WebSocket  ws://localhost:6773/ocpp/{chargerId}\n'
                printf '  Load balancer   http://localhost:8787/health\n'
                printf '  PostgreSQL      localhost:5433\n'
                printf '============================================================\n'
                printf '  Stop: docker compose down\n'
                printf '  Reset data: docker compose down --volumes\n'
                printf '============================================================\n\n'
        restart: "no"

volumes:
    voltgrid_postgres_data:
